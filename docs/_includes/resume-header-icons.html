{% assign contact = site.data.site_settings %}
<nav class="social-icons resume-header__icons" aria-label="Contact links">
  <ul class="social-icons__list">
    <li class="social-icons__item">
      <a
        class="social-icons__link social-icons__link--location"
        href="{{ contact.resume_location_url }}"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="{{ contact.resume_location_label }}"
        title="{{ contact.resume_location_label }}"
      >
        <span class="social-icons__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </span>
        <span class="social-icons__label">{{ contact.resume_location_label }}</span>
      </a>
    </li>
    {% if contact.phone_href != blank and contact.phone_display != blank %}
    <li class="social-icons__item">
      <a
        class="social-icons__link social-icons__link--phone"
        href="tel:{{ contact.phone_href }}"
        aria-label="{{ contact.phone_display }}"
        title="{{ contact.phone_display }}"
      >
        <span class="social-icons__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </span>
        <span class="social-icons__label">{{ contact.phone_display }}</span>
      </a>
    </li>
    {% endif %}
    <li class="social-icons__item">
      <a
        class="social-icons__link social-icons__link--email"
        href="mailto:{{ contact.email }}"
        aria-label="Email"
      >
        <span class="social-icons__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </span>
        <span class="social-icons__label">Email</span>
      </a>
    </li>
    <li class="social-icons__item">
      <a
        class="social-icons__link social-icons__link--linkedin"
        href="{{ contact.linkedin }}"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="LinkedIn"
      >
        <span class="social-icons__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" role="img">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 4.126 0 2.063 2.063 0 0 1-2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </span>
        <span class="social-icons__label">LinkedIn</span>
      </a>
    </li>
    <li class="social-icons__item">
      <a
        class="social-icons__link social-icons__link--website"
        href="{{ site.url }}"
        aria-label="Website"
      >
        <span class="social-icons__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </span>
        <span class="social-icons__label">Website</span>
      </a>
    </li>
  </ul>
</nav>
