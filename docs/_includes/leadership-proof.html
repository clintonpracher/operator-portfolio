{% assign proof = site.data.leadership_proof %}
<ul class="leadership-proof-grid" aria-label="Selected leadership proof">
  {% for card in proof.items %}
  <li class="deck-card leadership-proof-card">
    <span class="leadership-proof-card__icon" aria-hidden="true">
      {% include proof-icon.html icon=card.icon %}
    </span>
    <h3 class="deck-card__title">
      {{ card.title }}
      <span class="deck-card__arrow" aria-hidden="true">↗</span>
    </h3>
    <p class="deck-card__body">{{ card.body }}</p>
  </li>
  {% endfor %}
</ul>
