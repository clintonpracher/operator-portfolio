default_audience: director_vp

audience_order:
  - director_vp
  - senior_ic
  - operator

launches_heading: Selected Product Launches
launches:
  - title: Enterprise AI Product Suite
    meta: Dentsu, 2024 to 2025
    icon: ai-governance
    body: 13 AI products across 100 plus markets, enabling privacy safe data connections at enterprise scale.
  - title: Media360 Unified Reporting
    meta: Merkle, 2023
    icon: data-layers
    body: Consolidated 95 percent of a $600M budget across 140 markets into unified full funnel reporting.
  - title: V Shred Mobile App
    meta: V Shred, 2018
    icon: growth
    body: Consumer fitness app that hit 100K downloads in its first 24 hours, with sustained engagement gains.

audiences:
  director_vp:
    label: Director
    layout: layout-2x2
    hero:
      eyebrow: Platform · Data · AI leadership
      paragraphs:
        - Product leadership at portfolio scale across platform, data, and AI. I own decision infrastructure, investment prioritization, and the operating models that make roadmaps defensible.
        - The tools are not the point. Fluency across the stack is what lets me recommend and govern the right architecture for the business, not vendor defaults.
    proof_footer: Platform · Data · AI across Dentsu · Merkle · Business Insider · V Shred
    proof_metrics:
      - value: "$600M"
        label: Investment governed
        icon: data-layers
      - value: "$8M"
        label: Portfolio budget
        icon: budget
      - value: "13"
        label: AI & data products
        icon: portfolio
    capabilities_heading: Platform and data fluency
    capabilities_intro: Judgment areas where I set direction, investment, and governance across complex global portfolios.
    show_agent_os: false
    capabilities:
      - title: Data and decision infrastructure
        icon: data-layers
        judgment: Unifies fragmented data estates into one decision layer that leadership can trust for investment and reporting calls.
        highlights:
          - Single source of truth across markets and divisions
          - Investment latency and escalation reduction
          - Semantic ownership with data engineering partners
        stack: Snowflake, Databricks, Looker, Airflow
      - title: AI product strategy and governance
        icon: ai-governance
        judgment: Scales AI portfolios in regulated markets by designing governance as a product constraint, not a late-stage review gate.
        highlights:
          - Privacy-safe data architecture at global scale
          - Legal and policy as design inputs
          - Portfolio coherence across 13+ AI products
        stack: Enterprise AI suites, regulated-market launch patterns
      - title: Enterprise platform and integration
        icon: platform
        judgment: Modernizes martech and enterprise platforms so catalog, identity, and integration decisions support growth without fragmenting ownership.
        highlights:
          - Multi-market platform and catalog architecture
          - Martech and CRM ecosystem integration
          - Vendor strategy aligned to decision rights
        stack: Salesforce ecosystem, Contentful, global martech stacks
      - title: Product organization, leadership, and investment
        icon: strategy
        judgment: Builds portfolio governance, KPI frameworks, and PM operating models so teams ship against one investment narrative.
        highlights:
          - Budget ownership and prioritization forums
          - Cross-functional alignment without consensus theater
          - PM development and delivery accountability
        stack: Portfolio forums, KPI frameworks, operating model design

  senior_ic:
    label: Principal & Senior IC
    layout: layout-2x2
    hero:
      eyebrow: Full-stack product · Data · AI
      paragraphs:
        - My skills span industries with a focus on data and AI. I own the full experience from integrations through UX and serve every stakeholder in the chain.
        - These are representative capabilities, not an exhaustive list. I am a full-stack product management professional who can spec, partner, and ship with engineering and data teams.
    proof_footer: Full-stack Product Management · Data · Platform · AI
    proof_metrics:
      - value: "13"
        label: AI & data products
        icon: portfolio
      - value: "100K"
        label: Downloads in 24h
        icon: growth
      - value: "95%"
        label: Budget consolidated
        icon: data-layers
    capabilities_heading: Technical capabilities
    capabilities_intro: Hands-on fluency across data, AI, cloud, and delivery systems I use to spec and ship with engineering partners.
    show_agent_os: false
    capabilities:
      - title: Data and analytics
        icon: data-layers
        judgment: Builds and specs pipelines, semantic layers, and reporting products that turn fragmented sources into decisions product and finance can act on.
        highlights:
          - SQL and warehouse-centric analytics design
          - Looker and Tableau product surfaces
          - ETL and orchestration with data engineering
        stack: Snowflake, Databricks, Python, SQL, Looker, Tableau, Airflow
      - title: AI/ML
        icon: ai-governance
        judgment: Ships generative and ML-backed products with clear data boundaries, evaluation criteria, and integration paths into existing workflows.
        highlights:
          - AI product strategy and ML integration
          - Privacy-safe data architecture
          - Generative AI product patterns
        stack: AI product strategy, ML integration, generative AI products
      - title: Cloud and application stack
        icon: platform
        judgment: Partners with engineering on cloud-native delivery, APIs, and front-end surfaces when the product requires direct technical depth.
        highlights:
          - AWS, GCP, and Azure deployment patterns
          - API and service integration design
          - Prototyping with modern web stacks
        stack: AWS, Google Cloud, Azure, Python, JavaScript, React, Node
      - title: Product delivery and enterprise systems
        icon: strategy
        judgment: Runs delivery across Agile frameworks and enterprise systems so roadmaps, backlogs, and client platforms stay aligned to outcomes.
        highlights:
          - Jira, Confluence, ProductBoard, Figma
          - CRM, PIM, and commerce platform integrations
          - Agile, Scrum, and SAFe at scale
        stack: Jira, ProductBoard, Figma, Salesforce, Contentful, SAFe

  operator:
    label: Operator
    layout: layout-2x2
    hero:
      eyebrow: Operator systems · Governed AI
      paragraphs:
        - "I run a live operator control plane: skills, automations, scheduled tasks, and registry discipline with one Active Writer per task across models and tools."
        - "The same decision architecture I use in enterprise product leadership runs at operator scale: explicit ownership, measurable proof, and systems that stay current through certification rhythm."
    proof_footer: Multi-model operator control plane · single-writer governance
    proof_use_stats: true
    capabilities_heading: Operator systems and AI-native practice
    capabilities_intro: How I design, govern, and run agentic workflows as an operating layer for product delivery, not a pile of disconnected tools.
    show_agent_os: true
    capabilities:
      - title: Governed operator systems
        icon: control-plane
        judgment: Assigns one Active Writer per task across registry, execution host, audit layer, and connector islands at operator scale.
        highlights:
          - Operator Control Plane design and operation
          - Registry and task ownership discipline
          - Connector islands without duplicate writes
        stack: Cursor, Claude, governed automation registry
      - title: Automation fleet and certification
        icon: automation
        stats_metric: cursor_automations
        judgment: scheduled automations with explicit ownership so overnight work produces morning signal without conflicting writes.
        highlights:
          - Scheduled execution at governed scale
          - Certification rhythm for skills and automations
          - Audit cycles that keep the system current
        stack: Cursor Automations, scheduled task registry
      - title: AI-native prototyping
        icon: ai-governance
        judgment: Prototypes products and workflows with AI-native tools while keeping production boundaries and governance explicit.
        highlights:
          - Rapid prototyping with Claude and Cursor
          - Workflow automation with n8n and agents
          - HTML/CSS surfaces for proof artifacts
        stack: Claude, ChatGPT, Cursor, n8n, Lovable
      - title: Decision systems and proof
        icon: architecture
        judgment: "Builds decision systems with one pipeline, explicit ownership, and proof artifacts that show how product and platform choices hold up under scrutiny."
        highlights:
          - Decision architecture for product and platform work
          - Proof portfolios tied to operating model
          - Cross-session memory and continuity discipline
        stack: Decision architecture, proof-at-a-glance systems
