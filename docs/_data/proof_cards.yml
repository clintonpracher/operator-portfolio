    description: Delivered $60M incremental revenue and 331% YoY organic growth through catalog, SEO, and platform architecture decisions.
  - title: The Product System Stabilization Framework
    url: /work/proof/product-system-stabilization/
    icon: portfolio
    description: Rebuilt portfolio governance across 13 products so roadmaps, ownership, and investment calls stopped conflicting.
