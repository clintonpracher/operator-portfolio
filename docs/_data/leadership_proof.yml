items:
  - title: AI and data portfolio leadership
    icon: portfolio
    body: >-
      Owned portfolio strategy and execution for 13 AI and data products across 100+ global markets.
      Managed an $8M budget and led 60+ engineers, analysts, and program leads across distributed teams.
  - title: Enterprise decision systems at $600M scale
    icon: data-layers
    body: >-
      Built the KPI and measurement framework that consolidated 95% of $600M in global marketing spend.
      Reduced investment decision latency by approximately 40% and gave leaders a unified view of
      performance, cost drivers, and attribution.
  - title: Product organization leadership
    icon: org
    body: >-
      Built a team of five product managers from the ground up after promotion to Head of Product Management.
      Four people coached from business analyst level later advanced into Senior Product Manager roles.
  - title: Consumer platform outcomes
    icon: growth
    body: >-
      Delivered $60M in incremental revenue and 331% year-over-year organic growth through digital platform
      improvements. In a separate subscription turnaround, reduced annual cancellation from 75% to under 30%
      and sustained 10% to 12% annual growth for three years.
  - title: Operator Control Plane
    icon: control-plane
    body: >-
      Built and operate an AI-enabled control plane with 65 specialized skills and 28 governed automations.
      It applies explicit task ownership, decision controls, and operating rules to run an advisory practice
      at solo-operator scale. The portfolio and supporting case studies show the system in use.
