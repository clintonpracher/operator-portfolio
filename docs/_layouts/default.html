<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  {% include head-fonts.html %}
  <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="{{ '/assets/css/imperious/styles.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/chrome-compat.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/cpo-deck.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/footer-icons.css' | relative_url }}">
</head>
<body class="portfolio-body page-default">
  {% include gtm-body.html %}
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include site-header.html %}
  <main class="site-main" id="main-content">
    {{ content }}
  </main>
  {% include site-footer.html %}
  <script src="{{ '/assets/js/portfolio.js' | relative_url }}" defer></script>
</body>
</html>
