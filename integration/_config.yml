title: Clinton Pracher
description: Product leader who builds decision systems, not just products. Operator Control Plane, governed AI ops, platform/data/AI. Principal / Director · Remote US
url: "https://clintonpracher.com"
baseurl: ""
# Personal GTM (My Personal Website). Never GTM-PDFDNM7V (GHL / business).
# GA4 is configured inside this container, not in the HTML.
gtm_container_id: "GTM-PGTK2264"
theme: null
markdown: kramdown
permalink: pretty
plugins: []
defaults:
  - scope:
      path: "index.md"
    values:
      layout: home
      title: Home
  - scope:
      path: "about"
    values:
      layout: sectioned
      title: About Me
  - scope:
      path: "work/README.md"
    values:
      layout: sectioned
      title: My Work
  - scope:
      path: "work/skills.md"
    values:
      layout: sectioned
      title: Skills
  - scope:
      path: "prompt-library"
    values:
      layout: sectioned
  - scope:
      path: "thought-leadership/README.md"
    values:
      layout: sectioned
      title: Thought Leadership
  - scope:
      path: "work/case-studies"
    values:
      layout: case-study
  - scope:
      path: "work/proof"
    values:
      layout: sectioned
  - scope:
      path: "resume"
    values:
      layout: resume
  - scope:
      path: "resume/resume.md"
    values:
      title: Resume
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - PUBLISH.md
  - design-kit
  - integration
  - content
  - prompt_library
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .gitignore
