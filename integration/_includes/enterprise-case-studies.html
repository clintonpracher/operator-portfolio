{% assign studies = site.data.enterprise_case_studies %}
<ul class="deck-card-grid case-study-cards" aria-label="Enterprise case studies">
  {% for item in studies.items %}
  <li class="deck-card deck-card--horizontal proof-card case-study-card">
    <a href="{{ item.url | relative_url }}">
      <div class="deck-card__row deck-card__row--title">
        {% include deck-card-linked-title.html icon=item.icon title=item.title %}
      </div>
      <div class="deck-card__row deck-card__row--meta">
        <p class="deck-card__body">{{ item.meta }}</p>
      </div>
    </a>
  </li>
  {% endfor %}
</ul>
