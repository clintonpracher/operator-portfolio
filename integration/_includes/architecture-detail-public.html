{% assign detail = site.data.site_settings.architecture.detail %}
<figure class="architecture-view architecture-view--detail">
  <div class="architecture-view__header">
    <div>
      <p class="architecture-view__eyebrow">Control plane detail</p>
      <h3>Seven swimlanes, one spine, and the libraries that keep writes honest.</h3>
    </div>
    <span class="architecture-view__status">Next layer down</span>
  </div>

  <div class="architecture-view__product-summary">
    <p class="architecture-view__product-summary-label">Product summary</p>
    <p class="architecture-view__product-summary-text">The more AI assistants and tools you use, the harder it becomes to know which information is current and correct. Giving just one assistant at a time permission to update each task keeps changes from clashing as more assistants join the work.</p>
  </div>

  <p class="architecture-view__diagram-note">To read the diagram, start with Reference flow in the lower-right panel, then follow the numbered read order directly below it.</p>

  {% if detail.image != "" %}
  <p class="architecture-view__actions">
    <a class="link-pill" href="{{ detail.image | relative_url }}" target="_blank" rel="noopener noreferrer">Open full diagram</a>
    <a class="link-pill" href="{{ '/assets/diagrams/architecture-one-glance.svg' | relative_url }}">One-glance view</a>
  </p>
  <div class="architecture-view__scroll">
    <img class="architecture-view__image" src="{{ detail.image | relative_url }}" alt="{{ detail.alt }}">
  </div>
  {% endif %}

  <figcaption>
    Reference flow and numbered read order: lower-right panels, stacked.
  </figcaption>
</figure>
